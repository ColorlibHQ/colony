name: Deploy

# Two Cloudflare Pages projects from one repo:
#   colony.colorlib.com       docs — the canonical, indexable site
#   colony-demo.colorlib.com  the app — deliberately not indexed
#
# Both are second-level hosts on purpose. Cloudflare's Universal SSL covers
# colorlib.com and *.colorlib.com but NOT *.colony.colorlib.com, so a
# third-level host needs its own certificate and comes up minutes later.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs -> colony.colorlib.com
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm build
        working-directory: docs

      # Skipped rather than failed when the secrets are absent, so a fork — or
      # this repo before the token exists — does not show a red X for something
      # that is not broken. The `env` context is readable in a step-level `if`;
      # `secrets` is not.
      - uses: cloudflare/wrangler-action@v3
        if: env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=colony-docs

      - name: No deploy credentials
        if: env.CF_TOKEN == ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice::Built successfully. Set CLOUDFLARE_API_TOKEN and \
          CLOUDFLARE_ACCOUNT_ID to deploy." 

  demo:
    name: Demo -> colony-demo.colorlib.com
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # build:demo, NOT build — the hosted demo needs the mock API to have
      # anything to show. Never use this artifact as a starting point for a
      # real app; it bundles MSW.
      - run: pnpm build:demo

      - uses: cloudflare/wrangler-action@v3
        if: env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=colony-demo

      - name: No deploy credentials
        if: env.CF_TOKEN == ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice::Built successfully. Set CLOUDFLARE_API_TOKEN and \
          CLOUDFLARE_ACCOUNT_ID to deploy." 
